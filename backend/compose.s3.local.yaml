services:
  s3local:
    image: chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-localreview}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-localreviewsecret}
      S3_BUCKET: ${S3_BUCKET:-raw-materials}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3local_data:/data
    restart: unless-stopped

  s3-init:
    build: .
    command: ["/app/rawstorage", "init-bucket"]
    environment:
      DATABASE_URL: postgres://burmalda:burmalda@db:5432/burmalda?sslmode=disable
      BACKEND_CONFIG_FILE: /app/config.yaml
      RAW_STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET:-raw-materials}
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3local:8333
      AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-localreview}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-localreviewsecret}
    depends_on:
      s3local:
        condition: service_started
    restart: "no"

  worker:
    environment:
      RAW_STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET:-raw-materials}
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3local:8333
      AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-localreview}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-localreviewsecret}
      AWS_SESSION_TOKEN: ""
    depends_on:
      s3-init:
        condition: service_completed_successfully

  rawstorage:
    environment:
      S3_BUCKET: ${S3_BUCKET:-raw-materials}
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3local:8333
      AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-localreview}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-localreviewsecret}
      AWS_SESSION_TOKEN: ""
    depends_on:
      s3-init:
        condition: service_completed_successfully

volumes:
  s3local_data:
