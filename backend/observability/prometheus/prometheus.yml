global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 19090
        refresh_interval: 30s
  - job_name: observer
    static_configs:
      - targets: ["observer:19091"]
  - job_name: retention
    static_configs:
      - targets: ["retention:19093"]
