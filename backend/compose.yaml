services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: burmalda
      POSTGRES_USER: burmalda
      POSTGRES_PASSWORD: burmalda
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burmalda -d burmalda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
