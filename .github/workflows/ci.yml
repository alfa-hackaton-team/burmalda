name: CI and images

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/ci.yml

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - name: Check dependencies and formatting
        run: |
          go mod verify
          unformatted="$(find . -name '*.go' -print0 | xargs -0 -r gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Apply migrations twice
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
      - name: Unit and PostgreSQL integration tests
        run: go test -race -count=1 -p 1 ./...

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/ml/requirements-validation.txt
      - run: python -m pip install -r docs/ml/requirements-validation.txt
      - name: Validate ML and HTTP contracts
        run: |
          python backend/internal/apicontract/generate.py --check
          python docs/ml/scripts/check_ml_contracts.py --full
          python docs/ml/scripts/check_api_contracts.py
          python backend/testdata/ml-payloads/validate.py
          python -m unittest discover -s docs/ml/scripts -p 'test_*.py'
      - name: Verify generated observability files
        run: |
          python backend/observability/grafana/generate_dashboard.py
          python backend/observability/grafana/generate_alerts.py
          git diff --exit-code -- backend/observability/grafana/provisioning

  ml-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test ML service when present
        run: |
          if [[ -d ml ]]; then
            test -f ml/Dockerfile
            test -x ml/ci.sh
            ./ml/ci.sh
          else
            echo 'ML runtime is not in this repository; contracts are checked by the contracts job.'
          fi

  vulnerability-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  images:
    needs: [workflow-lint, backend, contracts, ml-runtime, vulnerability-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - name: Build backend image
        run: docker build --pull -t backend-ci ./backend
      - name: Check compiled backend binaries
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          container="$(docker create backend-ci /app/api)"
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p /tmp/backend-bin
          for binary in api worker observer retention migrate; do
            docker cp "$container:/app/$binary" "/tmp/backend-bin/$binary"
            govulncheck -mode=binary "/tmp/backend-bin/$binary"
          done
      - name: Build ML image when present
        run: |
          if [[ -d ml ]]; then
            docker build --pull -t ml-ci ./ml
          fi

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Log in to GHCR
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Buildx builder
        run: docker buildx create --use
      - name: Publish immutable commit images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}"
          docker buildx build --pull --push --sbom=true --provenance=mode=max \
            --metadata-file /tmp/backend-image.json \
            -t "$image_prefix/backend:$tag" ./backend
          echo "Backend: $image_prefix/backend@$(jq -r '."containerimage.digest"' /tmp/backend-image.json)" >> "$GITHUB_STEP_SUMMARY"
          if [[ -d ml ]]; then
            docker buildx build --pull --push --sbom=true --provenance=mode=max \
              --metadata-file /tmp/ml-image.json \
              -t "$image_prefix/ml:$tag" ./ml
            echo "ML: $image_prefix/ml@$(jq -r '."containerimage.digest"' /tmp/ml-image.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
