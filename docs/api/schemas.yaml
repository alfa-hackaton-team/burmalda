        created_at:
          type: string
          format: date-time
        document_version_id:
          type: string
          minLength: 1
        event_ids:
          type: array
          items:
            type: string
            minLength: 1
        error:
          "$ref": "#/components/schemas/Error"
      additionalProperties: false
      required:
      - processing_id
      - article_version_id
      - pipeline_version
      - state
      - trace_id
      - created_at
      allOf:
      - if:
          properties:
            state:
              const: SUCCEEDED
          required:
          - state
        then:
          required:
          - document_version_id
          - event_ids
      - if:
          properties:
            state:
              const: FAILED
          required:
          - state
        then:
          required:
          - error
      description: Вычислительная обработка материала от Go; не синхронизация источника.
        SUCCEEDED содержит document_version_id и event_ids, включая пустой список,
        если событие не выделено. FAILED содержит безопасную ошибку. Повтор с тем
        же ключом возвращает ту же операцию.
