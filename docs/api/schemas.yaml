---
openapi: 3.1.0
info:
  title: 'Burmalda: общие форматы обмена данными'
  version: 0.1.0
  description: Общие форматы обмена между интерфейсом, сервером и ML. Схемы задают
    структуру контекста, доказательств и ответов, но не физические таблицы PostgreSQL.
    Семантические правила применяются вместе с JSON Schema.
paths: {}
components:
  schemas:
    CompanyContext:
      type: object
      properties:
        context_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        kind:
          const: COMPANY
        company_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
      additionalProperties: false
      required:
      - context_id
      - kind
      - company_id
    GroupContext:
      type: object
      properties:
        context_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        kind:
          const: GROUP
        group_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
      additionalProperties: false
      required:
      - context_id
      - kind
      - group_id
    BusinessContext:
      oneOf:
      - "$ref": "#/components/schemas/CompanyContext"
      - "$ref": "#/components/schemas/GroupContext"
      discriminator:
        propertyName: kind
        mapping:
          COMPANY: "#/components/schemas/CompanyContext"
          GROUP: "#/components/schemas/GroupContext"
    ProfileRef:
      type: object
      properties:
        profile_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        version:
          type: string
      additionalProperties: false
      required:
      - profile_id
      - version
    MaterialRef:
      type: object
      properties:
        source_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        document_version_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        chunk_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        article_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        article_version_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
      additionalProperties: false
      required:
      - source_id
      - document_version_id
      - chunk_id
    FeatureRef:
      type: object
      properties:
        profile:
          "$ref": "#/components/schemas/ProfileRef"
        feature_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        contributing_company_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Идентификатор предметной области со скрытой внутренней структурой;
              не исходный ключ набора и не обязательный UUID в БД.
      additionalProperties: false
      required:
      - profile
      - feature_id
      - contributing_company_ids
    Provenance:
      type: object
      properties:
        source_snapshot_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        record_refs:
          type: array
          items:
            type: string
        derivation_version:
          type: string
        description:
          type: string
      additionalProperties: false
      required:
      - source_snapshot_id
      - record_refs
      - derivation_version
    MaterialEvidence:
      type: object
      properties:
        evidence_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        evidence_type:
          type: string
          enum:
          - EXTERNAL_NEWS
          - ALFA_ANALYTICS
        reference:
          "$ref": "#/components/schemas/MaterialRef"
        excerpt:
          type: string
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        fetched_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - evidence_id
      - evidence_type
      - reference
      - excerpt
      - published_at
      - fetched_at
    CompanyEvidence:
      type: object
      properties:
        evidence_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        evidence_type:
          const: COMPANY_DATA
        reference:
          "$ref": "#/components/schemas/FeatureRef"
        content:
          type: string
        provenance:
          "$ref": "#/components/schemas/Provenance"
      additionalProperties: false
      required:
      - evidence_id
      - evidence_type
      - reference
      - content
      - provenance
    Evidence:
      oneOf:
      - "$ref": "#/components/schemas/MaterialEvidence"
      - "$ref": "#/components/schemas/CompanyEvidence"
    EvidenceLink:
      type: object
      properties:
        evidence_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        relation:
          type: string
          enum:
          - SUPPORT
          - CONTRADICT
          - CONTEXT
      additionalProperties: false
      required:
      - evidence_id
      - relation
    Claim:
      type: object
      properties:
        claim_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        text:
          type: string
        claim_type:
          type: string
          enum:
          - FACT
          - ALFA_ANALYTICS
          - AI_INFERENCE
          - FORECAST
        verification_status:
          type: string
          enum:
          - SUPPORTED
          - PARTIALLY_SUPPORTED
          - UNSUPPORTED
        evidence_links:
          type: array
          items:
            "$ref": "#/components/schemas/EvidenceLink"
        assumptions:
          type: array
          items:
            type: string
        time_horizon:
          type: string
      additionalProperties: false
      required:
      - claim_id
      - text
      - claim_type
      - verification_status
      - evidence_links
      - assumptions
      description: Общий внутренний DTO включает UNSUPPORTED для проверки. Клиентское
        представление исключает неподтверждённые факты; существенные утверждения должны
        иметь ссылки на поддерживающие доказательства. Обязательные смысловые правила
        проверяет приложение, не только JSON Schema.
    SourceRef:
      type: object
      properties:
        source_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        name:
          type: string
        source_role:
          type: string
          enum:
          - external
          - bank
          - expert
        url:
          type: string
          format: uri
        published_at:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - source_id
      - name
      - source_role
    Limitation:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        related_claim_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Идентификатор предметной области со скрытой внутренней структурой;
              не исходный ключ набора и не обязательный UUID в БД.
      additionalProperties: false
      required:
      - code
      - message
    EventRef:
      type: object
      properties:
        event_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        title:
          type: string
        summary:
          type: string
        occurred_at:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - event_id
      - title
      - summary
    ProfileFeature:
      type: object
      properties:
        feature_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        name:
          type: string
        value: {}
        availability:
          type: string
          enum:
          - PRESENT
          - MISSING
          - AMBIGUOUS
        unit:
          type: string
        contributing_company_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Идентификатор предметной области со скрытой внутренней структурой;
              не исходный ключ набора и не обязательный UUID в БД.
        provenance:
          "$ref": "#/components/schemas/Provenance"
      additionalProperties: false
      required:
      - feature_id
      - name
      - value
      - availability
      - contributing_company_ids
      - provenance
      description: Тип value определяется словарём признаков после EDA; отсутствие
        данных не равно нулю или false.
    CompanyProfile:
      type: object
      properties:
        profile:
          "$ref": "#/components/schemas/ProfileRef"
        context:
          "$ref": "#/components/schemas/BusinessContext"
        built_at:
          type: string
          format: date-time
        features:
          type: array
          items:
            "$ref": "#/components/schemas/ProfileFeature"
        limitations:
          type: array
          items:
            "$ref": "#/components/schemas/Limitation"
      additionalProperties: false
      required:
      - profile
      - context
      - built_at
      - features
      - limitations
    ImpactState:
      type: object
      properties:
        label:
          type: string
        explanation:
          type: string
        policy_version:
          type: string
      additionalProperties: false
      required:
      - label
      - explanation
      - policy_version
      description: Понятная пользователю оценка влияния и её объяснение. label связан
        с версией правил; примеры high/medium обозначают качественные уровни, а не
        точную вероятность. Численные критерии оцениваются по экспертной разметке.
    FeedItem:
      type: object
      properties:
        preview_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        event:
          "$ref": "#/components/schemas/EventRef"
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        topic:
          type: string
        why_relevant:
          type: string
        feature_refs:
          type: array
          items:
            "$ref": "#/components/schemas/FeatureRef"
        sources:
          type: array
          items:
            "$ref": "#/components/schemas/SourceRef"
        impact:
          "$ref": "#/components/schemas/ImpactState"
        alert_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
      additionalProperties: false
      required:
      - preview_id
      - event
      - published_at
      - topic
      - why_relevant
      - feature_refs
      - sources
      - impact
    Alert:
      type: object
      properties:
        alert_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        context:
          "$ref": "#/components/schemas/BusinessContext"
        event:
          "$ref": "#/components/schemas/EventRef"
        impact:
          "$ref": "#/components/schemas/ImpactState"
        created_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - alert_id
      - context
      - event
      - impact
      - created_at
    InsightSection:
      type: object
      properties:
        section_type:
          type: string
          enum:
          - WHAT_HAPPENED
          - WHY_RELEVANT
          - RISKS
          - OPPORTUNITIES
          - SCENARIOS_ACTIONS
          - BANK_VIEW
          - AI_ANALYSIS
        claim_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Идентификатор предметной области со скрытой внутренней структурой;
              не исходный ключ набора и не обязательный UUID в БД.
      additionalProperties: false
      required:
      - section_type
      - claim_ids
    AgentResponse:
      type: object
      properties:
        trace_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        claims:
          type: array
          items:
            "$ref": "#/components/schemas/Claim"
        evidence:
          type: array
          items:
            "$ref": "#/components/schemas/Evidence"
        sections:
          type: array
          items:
            "$ref": "#/components/schemas/InsightSection"
        limitations:
          type: array
          items:
            "$ref": "#/components/schemas/Limitation"
        model_config_ref:
          type: string
      additionalProperties: false
      required:
      - trace_id
      - claims
      - evidence
      - sections
      - limitations
      - model_config_ref
    Insight:
      type: object
      properties:
        insight_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        revision:
          type: string
        primary_event:
          "$ref": "#/components/schemas/EventRef"
        supporting_event_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Идентификатор предметной области со скрытой внутренней структурой;
              не исходный ключ набора и не обязательный UUID в БД.
        context:
          "$ref": "#/components/schemas/BusinessContext"
        role_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        profile:
          "$ref": "#/components/schemas/ProfileRef"
        created_at:
          type: string
          format: date-time
        response:
          "$ref": "#/components/schemas/AgentResponse"
      additionalProperties: false
      required:
      - insight_id
      - revision
      - primary_event
      - supporting_event_ids
      - context
      - role_id
      - profile
      - created_at
      - response
    Generation:
      type: object
      properties:
        generation_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - INSUFFICIENT_EVIDENCE
          - FAILED
        trace_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        created_at:
          type: string
          format: date-time
        insight_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        message_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        error:
          "$ref": "#/components/schemas/Error"
      additionalProperties: false
      required:
      - generation_id
      - state
      - trace_id
      - created_at
      description: 'Состояние асинхронной генерации. Конечное состояние согласовано
        с результатом: успешное выполнение ссылается на сохранённый ресурс, ошибка
        содержит причину, недостаток доказательств обозначается отдельно.'
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - NOT_FOUND
          - FORBIDDEN_CONTEXT
          - SOURCE_UNAVAILABLE
          - ML_PROCESSING_ERROR
          - INSUFFICIENT_EVIDENCE
          - TIMEOUT
          - BUDGET_EXHAUSTED
          - CONFLICT
          - PROFILE_NOT_READY
          - UNSUPPORTED_ADAPTER
          - UNSUPPORTED_PIPELINE_VERSION
          - PAYLOAD_TOO_LARGE
          - INTERNAL_ERROR
          - UNAUTHENTICATED
          - FORBIDDEN
        message:
          type: string
        trace_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        retryable:
          type: boolean
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      description: Нет стеков ошибок, секретов и скрытых сведений о ресурсах. INSUFFICIENT_EVIDENCE
        может быть структурированным ограниченным результатом, если безопасная полезная
        часть доступна.
    Conversation:
      type: object
      properties:
        conversation_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        insight_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        insight_revision:
          type: string
        context:
          "$ref": "#/components/schemas/BusinessContext"
        role_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        created_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - conversation_id
      - insight_id
      - insight_revision
      - context
      - role_id
      - created_at
    Message:
      type: object
      properties:
        message_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        conversation_id:
          type: string
          minLength: 1
          description: Идентификатор предметной области со скрытой внутренней структурой;
            не исходный ключ набора и не обязательный UUID в БД.
        sequence:
          type: integer
          minimum: 1
        author:
          type: string
          enum:
          - USER
          - ASSISTANT
        created_at:
          type: string
          format: date-time
        text:
          type: string
        response:
          "$ref": "#/components/schemas/AgentResponse"
      additionalProperties: false
      required:
      - message_id
      - conversation_id
      - sequence
      - author
      - created_at
      description: USER содержит text; ASSISTANT — структурированный response. Правило
        проверяется на сервере. Скрытые рассуждения LLM не передаются.
    FollowUpResult:
      type: object
      properties:
        user_message:
          "$ref": "#/components/schemas/Message"
        assistant_message:
          "$ref": "#/components/schemas/Message"
      additionalProperties: false
      required:
      - user_message
      - assistant_message
    FeedbackInput:
      type: object
      properties:
        insight_revision:
          type: string
        rating:
          type: string
          enum:
          - POSITIVE
          - NEGATIVE
        reason:
          type: string
          enum:
          - IRRELEVANT
          - INCORRECT_CONCLUSION
          - POOR_SOURCES
          - TOO_GENERIC
          - OTHER
        comment:
          type: string
      additionalProperties: false
      required:
      - insight_revision
