---
openapi: 3.1.0
info:
  title: Burmalda shared DTO proposals
  version: 0.1.0-draft
  description: ASSUMPTION semantic schemas, not physical PostgreSQL schema. Auth and
    sync/async gates unresolved. See README.md.
paths: {}
components:
  schemas:
    CompanyContext:
      type: object
      properties:
        context_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        kind:
          const: COMPANY
        company_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
      additionalProperties: false
      required:
      - context_id
      - kind
      - company_id
    GroupContext:
      type: object
      properties:
        context_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        kind:
          const: GROUP
        group_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
      additionalProperties: false
      required:
      - context_id
      - kind
      - group_id
    BusinessContext:
      oneOf:
      - "$ref": "#/components/schemas/CompanyContext"
      - "$ref": "#/components/schemas/GroupContext"
      discriminator:
        propertyName: kind
        mapping:
          COMPANY: "#/components/schemas/CompanyContext"
          GROUP: "#/components/schemas/GroupContext"
    ProfileRef:
      type: object
      properties:
        profile_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        version:
          type: string
      additionalProperties: false
      required:
      - profile_id
      - version
    MaterialRef:
      type: object
      properties:
        source_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        document_version_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        chunk_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        article_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        article_version_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
      additionalProperties: false
      required:
      - source_id
      - document_version_id
      - chunk_id
    FeatureRef:
      type: object
      properties:
        profile:
          "$ref": "#/components/schemas/ProfileRef"
        feature_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        contributing_company_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Opaque domain ID; не raw dataset key и не обещание UUID в
              БД.
      additionalProperties: false
      required:
      - profile
      - feature_id
      - contributing_company_ids
    Provenance:
      type: object
      properties:
        source_snapshot_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        record_refs:
          type: array
          items:
            type: string
        derivation_version:
          type: string
        description:
          type: string
      additionalProperties: false
      required:
      - source_snapshot_id
      - record_refs
      - derivation_version
    MaterialEvidence:
      type: object
      properties:
        evidence_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        evidence_type:
          type: string
          enum:
          - EXTERNAL_NEWS
          - ALFA_ANALYTICS
        reference:
          "$ref": "#/components/schemas/MaterialRef"
        excerpt:
          type: string
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        fetched_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - evidence_id
      - evidence_type
      - reference
      - excerpt
      - published_at
      - fetched_at
    CompanyEvidence:
      type: object
      properties:
        evidence_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        evidence_type:
          const: COMPANY_DATA
        reference:
          "$ref": "#/components/schemas/FeatureRef"
        content:
          type: string
        provenance:
          "$ref": "#/components/schemas/Provenance"
      additionalProperties: false
      required:
      - evidence_id
      - evidence_type
      - reference
      - content
      - provenance
    Evidence:
      oneOf:
      - "$ref": "#/components/schemas/MaterialEvidence"
      - "$ref": "#/components/schemas/CompanyEvidence"
    EvidenceLink:
      type: object
      properties:
        evidence_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        relation:
          type: string
          enum:
          - SUPPORT
          - CONTRADICT
          - CONTEXT
      additionalProperties: false
      required:
      - evidence_id
      - relation
    Claim:
      type: object
      properties:
        claim_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        text:
          type: string
        claim_type:
          type: string
          enum:
          - FACT
          - ALFA_ANALYTICS
          - AI_INFERENCE
          - FORECAST
        verification_status:
          type: string
          enum:
          - SUPPORTED
          - PARTIALLY_SUPPORTED
          - UNSUPPORTED
        evidence_links:
          type: array
          items:
            "$ref": "#/components/schemas/EvidenceLink"
        assumptions:
          type: array
          items:
            type: string
        time_horizon:
          type: string
      additionalProperties: false
      required:
      - claim_id
      - text
      - claim_type
      - verification_status
      - evidence_links
      - assumptions
      description: Общий внутренний DTO включает UNSUPPORTED для проверки. Client
        projection исключает unsupported facts; material claims должны иметь supporting
        links. Semantic invariants проверяет приложение, не только JSON Schema.
    SourceRef:
      type: object
      properties:
        source_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        name:
          type: string
        source_role:
          type: string
          enum:
          - external
          - bank
          - expert
        url:
          type: string
          format: uri
        published_at:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - source_id
      - name
      - source_role
    Limitation:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        related_claim_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Opaque domain ID; не raw dataset key и не обещание UUID в
              БД.
      additionalProperties: false
      required:
      - code
      - message
    EventRef:
      type: object
      properties:
        event_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        title:
          type: string
        summary:
          type: string
        occurred_at:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - event_id
      - title
      - summary
    ProfileFeature:
      type: object
      properties:
        feature_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        name:
          type: string
        value: {}
        availability:
          type: string
          enum:
          - PRESENT
          - MISSING
          - AMBIGUOUS
        unit:
          type: string
        contributing_company_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Opaque domain ID; не raw dataset key и не обещание UUID в
              БД.
        provenance:
          "$ref": "#/components/schemas/Provenance"
      additionalProperties: false
      required:
      - feature_id
      - name
      - value
      - availability
      - contributing_company_ids
      - provenance
      description: Тип value определяется feature dictionary после EDA; missing не
        zero/false.
    CompanyProfile:
      type: object
      properties:
        profile:
          "$ref": "#/components/schemas/ProfileRef"
        context:
          "$ref": "#/components/schemas/BusinessContext"
        built_at:
          type: string
          format: date-time
        features:
          type: array
          items:
            "$ref": "#/components/schemas/ProfileFeature"
        limitations:
          type: array
          items:
            "$ref": "#/components/schemas/Limitation"
      additionalProperties: false
      required:
      - profile
      - context
      - built_at
      - features
      - limitations
    ImpactState:
      type: object
      properties:
        label:
          type: string
        explanation:
          type: string
        policy_version:
          type: string
      additionalProperties: false
      required:
      - label
      - explanation
      - policy_version
      description: Шкала/threshold TBD Q11; label не произвольный score. Примеры high/medium
        не фиксируют final enum.
    FeedItem:
      type: object
      properties:
        preview_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        event:
          "$ref": "#/components/schemas/EventRef"
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        topic:
          type: string
        why_relevant:
          type: string
        feature_refs:
          type: array
          items:
            "$ref": "#/components/schemas/FeatureRef"
        sources:
          type: array
          items:
            "$ref": "#/components/schemas/SourceRef"
        impact:
          "$ref": "#/components/schemas/ImpactState"
        alert_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
      additionalProperties: false
      required:
      - preview_id
      - event
      - published_at
      - topic
      - why_relevant
      - feature_refs
      - sources
      - impact
    Alert:
      type: object
      properties:
        alert_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        context:
          "$ref": "#/components/schemas/BusinessContext"
        event:
          "$ref": "#/components/schemas/EventRef"
        impact:
          "$ref": "#/components/schemas/ImpactState"
        created_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - alert_id
      - context
      - event
      - impact
      - created_at
    InsightSection:
      type: object
      properties:
        section_type:
          type: string
          enum:
          - WHAT_HAPPENED
          - WHY_RELEVANT
          - RISKS
          - OPPORTUNITIES
          - SCENARIOS_ACTIONS
          - BANK_VIEW
          - AI_ANALYSIS
        claim_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Opaque domain ID; не raw dataset key и не обещание UUID в
              БД.
      additionalProperties: false
      required:
      - section_type
      - claim_ids
    AgentResponse:
      type: object
      properties:
        trace_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        claims:
          type: array
          items:
            "$ref": "#/components/schemas/Claim"
        evidence:
          type: array
          items:
            "$ref": "#/components/schemas/Evidence"
        sections:
          type: array
          items:
            "$ref": "#/components/schemas/InsightSection"
        limitations:
          type: array
          items:
            "$ref": "#/components/schemas/Limitation"
        model_config_ref:
          type: string
      additionalProperties: false
      required:
      - trace_id
      - claims
      - evidence
      - sections
      - limitations
      - model_config_ref
    Insight:
      type: object
      properties:
        insight_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        revision:
          type: string
        primary_event:
          "$ref": "#/components/schemas/EventRef"
        supporting_event_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Opaque domain ID; не raw dataset key и не обещание UUID в
              БД.
        context:
          "$ref": "#/components/schemas/BusinessContext"
        role_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        profile:
          "$ref": "#/components/schemas/ProfileRef"
        created_at:
          type: string
          format: date-time
        response:
          "$ref": "#/components/schemas/AgentResponse"
      additionalProperties: false
      required:
      - insight_id
      - revision
      - primary_event
      - supporting_event_ids
      - context
      - role_id
      - profile
      - created_at
      - response
    Generation:
      type: object
      properties:
        generation_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - INSUFFICIENT_EVIDENCE
          - FAILED
        trace_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        created_at:
          type: string
          format: date-time
        insight_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        message_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        error:
          "$ref": "#/components/schemas/Error"
      additionalProperties: false
      required:
      - generation_id
      - state
      - trace_id
      - created_at
      description: 'ASSUMPTION: только async/hybrid candidate Q07; terminal state/result
        consistency — semantic invariant.'
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - NOT_FOUND
          - FORBIDDEN_CONTEXT
          - SOURCE_UNAVAILABLE
          - ML_PROCESSING_ERROR
          - INSUFFICIENT_EVIDENCE
          - TIMEOUT
          - BUDGET_EXHAUSTED
          - CONFLICT
          - PROFILE_NOT_READY
          - UNSUPPORTED_ADAPTER
          - INTERNAL_ERROR
        message:
          type: string
        trace_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        retryable:
          type: boolean
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      description: Нет stack traces, secrets и скрытых resource details. INSUFFICIENT_EVIDENCE
        может быть structured limited result, если есть безопасная полезная часть.
    Conversation:
      type: object
      properties:
        conversation_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        insight_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        insight_revision:
          type: string
        context:
          "$ref": "#/components/schemas/BusinessContext"
        role_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        created_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - conversation_id
      - insight_id
      - insight_revision
      - context
      - role_id
      - created_at
    Message:
      type: object
      properties:
        message_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        conversation_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        sequence:
          type: integer
          minimum: 1
        author:
          type: string
          enum:
          - USER
          - ASSISTANT
        created_at:
          type: string
          format: date-time
        text:
          type: string
        response:
          "$ref": "#/components/schemas/AgentResponse"
      additionalProperties: false
      required:
      - message_id
      - conversation_id
      - sequence
      - author
      - created_at
      description: USER содержит text; ASSISTANT содержит structured response; invariant
        проверяется server-side. Не LLM private reasoning.
    FollowUpResult:
      type: object
      properties:
        user_message:
          "$ref": "#/components/schemas/Message"
        assistant_message:
          "$ref": "#/components/schemas/Message"
      additionalProperties: false
      required:
      - user_message
      - assistant_message
    FeedbackInput:
      type: object
      properties:
        insight_revision:
          type: string
        rating:
          type: string
          enum:
          - POSITIVE
          - NEGATIVE
        reason:
          type: string
          enum:
          - IRRELEVANT
          - INCORRECT_CONCLUSION
          - POOR_SOURCES
          - TOO_GENERIC
          - OTHER
        comment:
          type: string
      additionalProperties: false
      required:
      - insight_revision
      - rating
      description: Reason taxonomy ASSUMPTION; negative допускает reason/comment,
        не требует текста.
    Feedback:
      type: object
      properties:
        feedback_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        insight_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        created_at:
          type: string
          format: date-time
        input:
          "$ref": "#/components/schemas/FeedbackInput"
      additionalProperties: false
      required:
      - feedback_id
      - insight_id
      - created_at
      - input
    SourceConfigInput:
      type: object
      properties:
        name:
          type: string
        source_type:
          type: string
        source_role:
          type: string
          enum:
          - external
          - bank
          - expert
        trust_level:
          type: string
        adapter_type:
          type: string
        endpoint:
          type: string
          format: uri
        enabled:
          type: boolean
        polling_interval_seconds:
          type: integer
          minimum: 1
        credential_ref:
          type: string
        adapter_config:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - name
      - source_type
      - source_role
      - trust_level
      - adapter_type
      - endpoint
      - enabled
      - polling_interval_seconds
      description: Только supported config; adapter_config валидируется adapter-specific
        schema; никаких inline secrets. Registry policy/restrictions на поля и trust
        TBD.
    SourceUpdate:
      type: object
      properties:
        name:
          type: string
        source_type:
          type: string
        source_role:
          type: string
          enum:
          - external
          - bank
          - expert
        trust_level:
          type: string
        adapter_type:
          type: string
        endpoint:
          type: string
          format: uri
        enabled:
          type: boolean
        polling_interval_seconds:
          type: integer
          minimum: 1
        credential_ref:
          type: string
        adapter_config:
          type: object
          additionalProperties: true
      additionalProperties: false
      description: PATCH allowlist и concurrent config_version review. Нельзя менять
        trust произвольно без разрешения.
    Source:
      type: object
      properties:
        source_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        config_version:
          type: string
        config:
          "$ref": "#/components/schemas/SourceConfigInput"
        health:
          type: string
          enum:
          - UNKNOWN
          - HEALTHY
          - DEGRADED
          - UNAVAILABLE
        last_sync_at:
          type:
          - string
          - 'null'
          format: date-time
        last_success_at:
          type:
          - string
          - 'null'
          format: date-time
        last_error:
          type: string
      additionalProperties: false
      required:
      - source_id
      - config_version
      - config
      - health
      - last_sync_at
      - last_success_at
      description: credential_ref — reference, не secret value; даже reference требует
        admin projection review.
    SyncOperation:
      type: object
      properties:
        sync_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        source_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
        trace_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        created_at:
          type: string
          format: date-time
        error:
          "$ref": "#/components/schemas/Error"
      additionalProperties: false
      required:
      - sync_id
      - source_id
      - state
      - trace_id
      - created_at
    TraceStage:
      type: object
      properties:
        stage_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        parent_stage_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        stage_type:
          type: string
        status:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        evidence_ids:
          type: array
          items:
            type: string
            minLength: 1
            description: Opaque domain ID; не raw dataset key и не обещание UUID в
              БД.
        feature_refs:
          type: array
          items:
            "$ref": "#/components/schemas/FeatureRef"
        summary:
          type: string
      additionalProperties: false
      required:
      - stage_id
      - stage_type
      - status
      - started_at
      - finished_at
      - evidence_ids
      - feature_refs
      description: Только разрешённая sanitized projection. Нет private reasoning/raw
        prompts.
    Trace:
      type: object
      properties:
        trace_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        stages:
          type: array
          items:
            "$ref": "#/components/schemas/TraceStage"
      additionalProperties: false
      required:
      - trace_id
      - stages
    ClientAnalyticsEvent:
      type: object
      properties:
        analytics_event_id:
          type: string
          minLength: 1
          description: Opaque domain ID; не raw dataset key и не обещание UUID в БД.
        schema_version:
          type: string
        event_type:
          type: string
          enum:
          - FEED_OPENED
          - INSIGHT_OPENED
          - SOURCE_CLICKED
          - ALERT_OPENED
        occurred_at:
          type: string
          format: date-time
        context_id:
          type: string
          minLength: 1
