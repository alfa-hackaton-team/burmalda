        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
