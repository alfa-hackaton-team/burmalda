                    структурой; не исходный ключ набора и не обязательный UUID в БД.
                query_intent:
                  type: string
              additionalProperties: false
              required:
              - request_context
              - primary_event_id
  "/internal/v0.1/analyses":
    post:
      operationId: mlAnalyze
      tags:
      - Agent
      summary: Подготовить персональный разбор с подтверждёнными основаниями
      x-ml-contract-version: v1
      description: Принимает AnalysisRequest v1 с request_type initial или reanalyze.
        Go формирует доверенный снимок контекста и события; Idempotency-Key равен
        request_operation_id. ML возвращает AnalysisResponse v1, а Go сохраняет
        результат и формирует публичный AgentResponse. Повтор не создаёт новое
        выполнение или платный вызов.
      responses:
        '200':
          description: Готовый результат при синхронном выполнении
          content:
            application/json:
              schema:
                "$ref": "../ml/contracts/v1/contracts.schema.json#/$defs/AnalysisResponse"
        '202':
          description: Принятие в асинхронную обработку
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/AnalysisOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '400':
          description: Отсутствует обязательный Idempotency-Key или некорректны параметры
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '409':
          description: Idempotency-Key уже связан с другим запросом
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - "$ref": "../ml/contracts/v1/contracts.schema.json#/$defs/AnalysisRequest"
              - properties:
                  request_type:
                    enum: [initial, reanalyze]
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          description: Ключ связывает повтор с исходной операцией в пределах пользователя
            и контекста. Повтор не создаёт новый платный запуск и не разрешает переиспользовать
            финальный персональный ответ между пользователями.
        description: Стабильный идентификатор операции Go. ML сохраняет его и отпечаток
          вычислительных параметров до платного вызова, возвращает прежнее выполнение
          на повтор и 409 при других параметрах. Технические trace_id и request_id
          не меняют идентичность операции.
  "/internal/v0.1/analyses/{analysis_id}":
