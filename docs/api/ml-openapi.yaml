            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Ограничение числа элементов страницы; применяется вместе с
            курсором для устойчивой постраничной выдачи.
    post:
      operationId: mlCreateSource
      tags:
      - SourceRegistry
      summary: Сохранить проверенную конфигурацию поддерживаемого источника
