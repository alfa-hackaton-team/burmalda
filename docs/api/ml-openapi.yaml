---
openapi: 3.1.0
info:
  title: 'Burmalda: внутренний API ML-сервиса'
  version: 0.1.0
  description: API персонализированной новостной аналитики. Внешние операции проверяют
    пользователя и доступ к ресурсу; внутренние получают доверенный контекст сервера.
    Генерация описывает готовый ответ и отслеживаемую операцию для длительного выполнения.
    Правила контекстов, доказательств и ошибок приведены в README.md.
paths:
  "/internal/v0.1/profiles/{profile_id}":
    get:
      operationId: mlGetProfile
      tags:
      - Profiles
      summary: Получить точную сохранённую версию профиля
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/CompanyProfile"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: version
        in: query
        required: true
        schema:
          type: string
          minLength: 1
  "/internal/v0.1/profile-rebuilds":
    post:
      operationId: mlRebuildProfile
      tags:
      - Profiles
      summary: Управляемое перестроение профиля, без периодического опроса CSV
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
        '202':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/ProfileRebuildOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  "$ref": "./schemas.yaml#/components/schemas/BusinessContext"
                source_snapshot_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
                trace_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
              additionalProperties: false
              required:
              - context
              - source_snapshot_id
              - trace_id
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          description: Ключ связывает повтор с исходной операцией в пределах пользователя
            и контекста. Повтор не создаёт новый платный запуск и не разрешает переиспользовать
            финальный персональный ответ между пользователями.
  "/internal/v0.1/profile-rebuilds/{rebuild_id}":
    get:
      operationId: mlGetProfileRebuild
      tags:
      - Profiles
      summary: Состояние перестроения и ссылка на новую версию профиля
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/ProfileRebuildOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      parameters:
      - name: rebuild_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  "/internal/v0.1/feed-rankings":
    post:
      operationId: mlRankFeed
      tags:
      - Retrieval
      summary: Ранжировать краткие карточки событий для доверенного контекста
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/FeedPage"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_context:
                  "$ref": "./schemas.yaml#/components/schemas/TrustedRequestContext"
                cursor:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                topic:
                  type: string
              additionalProperties: false
              required:
              - request_context
  "/internal/v0.1/evidence-retrievals":
    post:
      operationId: mlRetrieveEvidence
      tags:
      - Retrieval
      summary: Вернуть структурированный пакет доказательств EvidencePackage
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/EvidencePackage"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_context:
                  "$ref": "./schemas.yaml#/components/schemas/TrustedRequestContext"
                primary_event_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
                query_intent:
                  type: string
              additionalProperties: false
              required:
              - request_context
              - primary_event_id
  "/internal/v0.1/analyses":
    post:
      operationId: mlAnalyze
      tags:
      - Agent
      summary: Подготовить персональный разбор с подтверждёнными основаниями
      description: Агент может выполнить дополнительный поиск. EvidencePackage необязателен
        и не ограничивает допустимые этапы поиска. При передаче пакета проверяется
        совпадение контекста, профиля и трассировки; все новые доказательства сохраняют
        происхождение.
      responses:
        '200':
          description: Готовый результат при синхронном выполнении
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/AgentResponse"
        '202':
          description: Принятие в асинхронную обработку
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/AnalysisOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_context:
                  "$ref": "./schemas.yaml#/components/schemas/TrustedRequestContext"
                primary_event_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
                evidence_package:
                  "$ref": "./schemas.yaml#/components/schemas/EvidencePackage"
              additionalProperties: false
              required:
              - request_context
              - primary_event_id
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          description: Ключ связывает повтор с исходной операцией в пределах пользователя
            и контекста. Повтор не создаёт новый платный запуск и не разрешает переиспользовать
            финальный персональный ответ между пользователями.
  "/internal/v0.1/analyses/{analysis_id}":
    get:
      operationId: mlGetAnalysis
      tags:
      - Agent
      summary: Получить состояние выполнения и структурированный результат
      description: При асинхронном выполнении SUCCEEDED содержит AgentResponse в response;
        сервер сохраняет разбор или сообщение и связывает с ним внешнюю операцию.
        Внутренний analysis_id не равен публичному generation_id автоматически.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/AnalysisOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  "/internal/v0.1/follow-ups":
    post:
      operationId: mlFollowUp
      tags:
      - Agent
      summary: Ответить в контексте существующего разбора Insight
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
        '200':
          description: Синхронный вариант
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/AgentResponse"
        '202':
          description: Асинхронный вариант
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/AnalysisOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_context:
                  "$ref": "./schemas.yaml#/components/schemas/TrustedRequestContext"
                insight:
                  "$ref": "./schemas.yaml#/components/schemas/Insight"
                conversation_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
                history:
                  type: array
                  items:
                    "$ref": "./schemas.yaml#/components/schemas/Message"
                question:
                  type: string
                  minLength: 1
              additionalProperties: false
              required:
              - request_context
              - insight
              - conversation_id
              - history
              - question
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          description: Ключ связывает повтор с исходной операцией в пределах пользователя
