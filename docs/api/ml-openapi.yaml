        сервер сохраняет разбор или сообщение и связывает с ним внешнюю операцию.
        Внутренний analysis_id не равен публичному generation_id автоматически.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/AnalysisOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  "/internal/v0.1/follow-ups":
    post:
      operationId: mlFollowUp
      tags:
      - Agent
      summary: Ответить в контексте существующего разбора Insight
      x-ml-contract-version: v1
      description: Принимает AnalysisRequest v1 с request_type=follow_up.
        Go передает initial_insight с claims/evidence/чанками и структурированную историю
        до request_message_id. Профиль и событие зафиксированы исходным разбором.
        Idempotency-Key равен request_operation_id. Новый запуск имеет отдельный trace_id
        и parent_trace_id исходного анализа. Повтор не создает новое выполнение.
      responses:
        '200':
          description: Синхронный вариант
          content:
            application/json:
              schema:
                "$ref": "../ml/contracts/v1/contracts.schema.json#/$defs/AnalysisResponse"
        '202':
          description: Асинхронный вариант
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/AnalysisOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '400':
          description: Отсутствует обязательный Idempotency-Key или некорректны параметры
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '409':
          description: Idempotency-Key уже связан с другим запросом
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - "$ref": "../ml/contracts/v1/contracts.schema.json#/$defs/AnalysisRequest"
              - properties:
                  request_type:
                    enum:
                    - follow_up
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          description: Ключ связывает повтор с исходной операцией в пределах пользователя
            и контекста. Повтор не создаёт новый платный запуск и не разрешает переиспользовать
            финальный персональный ответ между пользователями.
        description: Стабильный идентификатор операции Go. ML сохраняет его и отпечаток
          вычислительных параметров до платного вызова, возвращает прежнее выполнение
          на повтор и 409 при других параметрах. Технические trace_id и request_id
          не меняют идентичность операции.
  "/internal/v0.1/traces/{trace_id}":
    get:
      operationId: mlGetTrace
      tags:
      - Trace
      summary: Этапы трассировки ML без чувствительных данных
      description: Доступно аутентифицированному Go по SERVICE_TOKEN. ML проверяет
        структуру и согласованность переданных данных.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Trace"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  "/internal/v0.1/quality":
    get:
      operationId: mlGetQuality
      tags:
