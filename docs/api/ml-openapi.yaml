      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
  "/internal/v0.1/article-processings":
    post:
      operationId: mlProcessArticle
      tags:
      - Processing
      summary: Принять сохранённый материал от Go на ML-обработку
      description: Go-воркер передаёт NormalizedArticle и безопасные метаданные источника.
        ML1 проверяет версию, создаёт чанки и embeddings для поиска; после готовности
        версии ML2 извлекает события и связывает их с документом. ML сохраняет связь
        article_version_id с document_version_id и версии конфигурации обоих этапов.
        pipeline_version обозначает согласованный набор этих конфигураций; для ML2
        ключ обработки событий — (document_version_id, event_pipeline_config_version).
        Перед запуском сохраняет ключ и отпечаток параметров; повтор не создаёт вторую
        обработку. Для пары (article_version_id, pipeline_version) существует одна
        логическая операция. trace_id — корреляция, а не основание для нового выполнения.
        Оригинал по raw_ref ML не загружает. Превышение согласованного лимита текста
        возвращает 413 без обрезания.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                article:
                  "$ref": "./schemas.yaml#/components/schemas/NormalizedArticle"
                source:
                  type: object
                  properties:
                    source_id:
                      type: string
                      minLength: 1
                    name:
                      type: string
                      minLength: 1
                    source_role:
                      type: string
                      enum:
                      - external
                      - bank
                      - expert
                    source_type:
                      type: string
                      minLength: 1
                    trust_level:
                      type: string
                      minLength: 1
                    config_version:
                      type: string
                      pattern: '^[1-9][0-9]*$'
                      description: Версия конфигурации источника, сохранённая вместе
                        с заданием Go. Повторы используют тот же снимок.
                  additionalProperties: false
                  required:
                  - source_id
                  - name
                  - source_role
                  - source_type
                  - trust_level
                  - config_version
                  description: Безопасная версия метаданных реестра Go для классификации
                    материала; без endpoint, credential_ref и конфигурации доступа
                    к издателю.
                pipeline_version:
                  type: string
                  minLength: 1
                  description: Версия правил ML, согласованная через конфигурацию
                    окружения и сохранённая Go в задании до POST. ML отклоняет
                    неподдерживаемую версию до запуска обработки.
                trace_id:
                  type: string
                  minLength: 1
              additionalProperties: false
              required:
              - article
              - source
              - pipeline_version
              - trace_id
              description: article.source_id должен совпадать с source.source_id.
                Go передаёт сохранённую версию материала; ML проверяет ссылки и метаданные,
                не загружает произвольные URL из запроса.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Стабильный ключ из (article_version_id, pipeline_version).
          Повтор с тем же материалом и значимыми метаданными источника, включая
          сохранённую config_version, возвращает
          прежний processing_id; другие значимые параметры дают 409. trace_id
          исключён из сравнения.
      responses:
        '202':
          description: Задание надёжно сохранено и принято. SUCCEEDED подтверждает,
            что чанки и embeddings доступны для поиска, а результат обработки событий
            сохранён; event_ids может быть пустым. Повтор возвращает ту же операцию.
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/ArticleProcessingOperation"
        '400':
          description: Невалидный JSON или структура запроса
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '409':
          description: Ключ уже использован с другими параметрами
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '413':
          description: Размер UTF-8 article.body без заголовка превысил согласованный
            предел либо превышен предел запроса; PAYLOAD_TOO_LARGE, без обрезания
            и автоматического повтора.
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '422':
          description: Неверный материал или неподдерживаемая pipeline_version;
            во втором случае код UNSUPPORTED_PIPELINE_VERSION. Без автоматического повтора.
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '429':
          description: Временное ограничение; Go повторяет с прежним ключом и учитывает
            Retry-After.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '503':
          description: Временная недоступность; Go ограниченно повторяет с прежним
            ключом и учитывает Retry-After, если он указан.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        default:
          description: Контролируемая ошибка обработки
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
  "/internal/v0.1/article-processings/{processing_id}":
    get:
      operationId: mlGetArticleProcessing
      tags:
      - Processing
      summary: Получить состояние обработки материала
      description: Go-воркер связывает состояние ML с исходной задачей загрузки. Успешная
        загрузка файла и успешная ML-обработка — отдельные результаты. SUCCEEDED
        означает сохранённые результаты и доступность для поиска. При 404 Go
        повторяет исходный POST с прежними параметрами и ключом для восстановления
        ссылки; исчезновение уже подтверждённой операции после такой попытки
        требует разбирательства.
      parameters:
      - name: processing_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Состояние и результат обработки
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/ArticleProcessingOperation"
        '404':
          description: Операция не найдена
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        default:
          description: Контролируемая ошибка чтения операции
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
components:
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      description: Служебный SERVICE_TOKEN из environment/secrets; не JWT. ML проверяет
        его на каждом запросе по защищённому внутреннему соединению. Токен не передаётся
        браузеру и не сохраняется в Git, логах или ответах.
security:
- serviceAuth: []
