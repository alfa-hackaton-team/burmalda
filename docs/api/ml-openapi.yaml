---
openapi: 3.1.0
info:
  title: 'Burmalda: внутренний API ML-сервиса'
  version: 0.1.0
  description: Внутренний API ML-сервиса для Go-бэкенда и его воркера. Все операции
    требуют Bearer SERVICE_TOKEN по защищённому соединению. ML не доступен напрямую
    интерфейсу или из интернета. Go владеет реестром, расписанием и загрузкой, ML
    принимает нормализованные материалы и выполняет вычислительную обработку.
paths:
  "/internal/v0.1/profiles/{profile_id}":
    get:
      operationId: mlGetProfile
      tags:
      - Profiles
      summary: Получить точную сохранённую версию профиля
      description: Доступно аутентифицированному Go по SERVICE_TOKEN. ML проверяет
        структуру и согласованность переданных данных.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/CompanyProfile"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: version
        in: query
        required: true
        schema:
          type: string
          minLength: 1
  "/internal/v0.1/profile-rebuilds":
    post:
      operationId: mlRebuildProfile
      tags:
      - Profiles
      summary: Управляемое перестроение профиля, без периодического опроса CSV
      description: Доступно аутентифицированному Go по SERVICE_TOKEN. ML проверяет
        структуру и согласованность переданных данных.
      responses:
        '202':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/ProfileRebuildOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  "$ref": "./schemas.yaml#/components/schemas/BusinessContext"
                source_snapshot_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
                trace_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
              additionalProperties: false
              required:
              - context
              - source_snapshot_id
              - trace_id
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          description: Ключ связывает повтор с исходной операцией в пределах пользователя
            и контекста. Повтор не создаёт новый платный запуск и не разрешает переиспользовать
            финальный персональный ответ между пользователями.
  "/internal/v0.1/profile-rebuilds/{rebuild_id}":
    get:
      operationId: mlGetProfileRebuild
      tags:
      - Profiles
      summary: Состояние перестроения и ссылка на новую версию профиля
      description: Доступно аутентифицированному Go по SERVICE_TOKEN. ML проверяет
        структуру и согласованность переданных данных.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/ProfileRebuildOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
      parameters:
      - name: rebuild_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  "/internal/v0.1/feed-rankings":
    post:
      operationId: mlRankFeed
      tags:
      - Retrieval
      summary: Ранжировать краткие карточки событий для доверенного контекста
      description: Доступно аутентифицированному Go по SERVICE_TOKEN. ML проверяет
        структуру и согласованность переданных данных.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/FeedPage"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_context:
                  "$ref": "./schemas.yaml#/components/schemas/TrustedRequestContext"
                cursor:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                topic:
                  type: string
              additionalProperties: false
              required:
              - request_context
  "/internal/v0.1/evidence-retrievals":
