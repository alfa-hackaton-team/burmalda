      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/FeedPage"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: SERVICE_TOKEN отсутствует или неверен; контекст не обрабатывается
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Внутреннее обращение не разрешено или ссылки выходят за допустимый
            контекст
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'ML: обязательный Bearer SERVICE_TOKEN от Go, проверка структуры
        и согласованности контекста'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
