          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Source"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "./schemas.yaml#/components/schemas/SourceConfigInput"
  "/internal/v0.1/sources/{source_id}":
    get:
      operationId: mlGetSource
      tags:
      - SourceRegistry
      summary: Карточка реестра
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Source"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
