---
openapi: 3.1.0
info:
  title: 'Burmalda: внешний API серверной части'
  version: 0.1.0
  description: API персонализированной новостной аналитики. Внешние операции проверяют
    пользователя и доступ к ресурсу; внутренние получают доверенный контекст сервера.
    Генерация описывает готовый ответ и отслеживаемую операцию для длительного выполнения.
    Правила контекстов, доказательств и ошибок приведены в README.md. Go проверяет
    server-side session по cookie session_id; изменяющие запросы требуют X-CSRF-Token
    и проверки Origin. Реестр источников, планировщик и воркер принадлежат Go.
    Административный GET источников требует sources:read, PATCH — sources:manage,
    а назначение trust_level/source_role и POST — также sources:trust.
    JSON источника ограничен 64 КиБ (HTTP 413 PAYLOAD_TOO_LARGE).
    Курсор реестра связан с пользователем, сессией и limit и не фиксирует снимок.
    Ответы одного источника содержат ETag, создание — также Location;
    last_error содержит безопасное описание без сырой диагностики загрузчика.
paths:
  "/v0.1/me":
    get:
      operationId: getMe
      tags:
      - Context
      summary: Текущий пользователь, определённый доверенным способом
      description: Go проверяет серверную сессию и доступ к ресурсу; административные
        полномочия отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Me"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: Нет действующей серверной сессии
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Недостаточно прав на контекст, роль или операцию; для изменяющего
            запроса также ошибка CSRF/Origin
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'Go: cookie-сессия, права в БД, CSRF и Origin для изменения'
  "/v0.1/contexts":
    get:
      operationId: listContexts
      tags:
      - Context
      summary: Доступные бизнес-контексты и доверенные роли
      description: Go проверяет серверную сессию и доступ к ресурсу; административные
        полномочия отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/ContextPage"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: Нет действующей серверной сессии
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Недостаточно прав на контекст, роль или операцию; для изменяющего
            запроса также ошибка CSRF/Origin
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'Go: cookie-сессия, права в БД, CSRF и Origin для изменения'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Ограничение числа элементов страницы; применяется вместе с
            курсором для устойчивой постраничной выдачи.
