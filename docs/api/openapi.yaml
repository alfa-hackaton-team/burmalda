            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
              additionalProperties: false
              required:
              - text
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
