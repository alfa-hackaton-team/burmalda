        полномочия проверяются отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Insight"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      parameters:
      - name: insight_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  "/v0.1/generations/{generation_id}":
    get:
      operationId: getGeneration
      tags:
      - Insight
      summary: Получить состояние асинхронной генерации
      description: Операция состояния используется при асинхронном или гибридном выполнении.
        Для SUCCEEDED проверяется наличие сохранённого результата и право пользователя
        на его чтение.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Generation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      parameters:
      - name: generation_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  "/v0.1/insights/{insight_id}/conversations":
    get:
      operationId: listConversations
      tags:
      - Conversation
      summary: История диалогов по своему разбору Insight
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
