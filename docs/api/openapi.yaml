---
openapi: 3.1.0
info:
  title: 'Burmalda: внешний API серверной части'
  version: 0.1.0
  description: API персонализированной новостной аналитики. Внешние операции проверяют
    пользователя и доступ к ресурсу; внутренние получают доверенный контекст сервера.
    Генерация описывает готовый ответ и отслеживаемую операцию для длительного выполнения.
    Правила контекстов, доказательств и ошибок приведены в README.md.
paths:
  "/v0.1/me":
    get:
      operationId: getMe
      tags:
      - Context
      summary: Текущий пользователь, определённый доверенным способом
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Me"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
  "/v0.1/contexts":
    get:
      operationId: listContexts
      tags:
      - Context
      summary: Доступные бизнес-контексты и доверенные роли
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/ContextPage"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Ограничение числа элементов страницы; применяется вместе с
            курсором для устойчивой постраничной выдачи.
  "/v0.1/feed":
    get:
      operationId: getFeed
      tags:
      - Feed
      summary: Персональная лента кратких карточек событий
      description: Сервер определяет доверенные роль, профиль и права доступа. Курсор
        сохраняет зафиксированное ранжирование; порядок — по персональной релевантности.
        Произвольный API оценки и фильтрации не вводится.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/FeedPage"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      parameters:
      - name: context_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Ограничение числа элементов страницы; применяется вместе с
            курсором для устойчивой постраничной выдачи.
      - name: topic
        in: query
        required: false
        schema:
          type: string
          minLength: 1
  "/v0.1/alerts":
    get:
      operationId: listAlerts
      tags:
      - Feed
      summary: События с высоким потенциальным влиянием для контекста
      description: Операция выполняется после проверки доверенного пользователя, контекста
        и разрешений. Внутренние обращения доступны через серверную границу, административные
        полномочия проверяются отдельно.
      responses:
        '200':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/AlertPage"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      parameters:
      - name: context_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Ограничение числа элементов страницы; применяется вместе с
            курсором для устойчивой постраничной выдачи.
  "/v0.1/insights":
    post:
      operationId: createInsight
      tags:
      - Insight
      summary: Запросить полный анализ при открытии карточки
      description: 'Роль, профиль и пользователь не принимаются от клиента: сервер
        определяет их и проверяет доступ. HTTP 200 возвращает готовый разбор; HTTP
        202 — операцию для отслеживания длительного выполнения. Повтор запроса учитывает
        ключ идемпотентности и исходный контекст.'
      responses:
        '200':
          description: Готовый структурированный разбор Insight при синхронном выполнении
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Insight"
        '202':
          description: Состояние генерации при асинхронном выполнении; Location указывает
            на операцию
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Generation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                context_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
                event_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
              additionalProperties: false
              required:
              - context_id
              - event_id
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          description: Ключ связывает повтор с исходной операцией в пределах пользователя
            и контекста. Повтор не создаёт новый платный запуск и не разрешает переиспользовать
            финальный персональный ответ между пользователями.
  "/v0.1/insights/{insight_id}":
    get:
      operationId: getInsight
      tags:
      - Insight
      summary: Получить сохранённую версию разбора Insight
      description: Операция выполняется после проверки доверенного пользователя, контекста
