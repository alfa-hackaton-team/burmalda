              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'Go: cookie-сессия, права в БД, CSRF и Origin для изменения'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: Непрозрачный идентификатор серверной сессии Go. Cookie выдаётся
        с HttpOnly, Secure и SameSite. user_id определяется только по проверенной
        сессии; права на контекст и роль проверяются в БД.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Токен защиты от CSRF, выданный механизмом доступа и связанный с
        серверной сессией. Go проверяет токен и разрешённый Origin на каждом изменяющем
        запросе; одного SameSite недостаточно.
security:
- sessionAuth: []
