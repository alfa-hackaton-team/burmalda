        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
