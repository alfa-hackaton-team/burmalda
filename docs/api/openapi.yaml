            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: Нет действующей серверной сессии
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Недостаточно прав на контекст, роль или операцию; для изменяющего
            запроса также ошибка CSRF/Origin
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '400':
          description: Отсутствует обязательный Idempotency-Key или некорректны параметры
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '409':
          description: Idempotency-Key уже связан с другим запросом
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'Go: cookie-сессия, права в БД, CSRF и Origin для изменения'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                context_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
                event_id:
                  type: string
                  minLength: 1
                  description: Идентификатор предметной области со скрытой внутренней
                    структурой; не исходный ключ набора и не обязательный UUID в БД.
              additionalProperties: false
              required:
              - context_id
              - event_id
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          description: Ключ связывает повтор с исходной операцией в пределах пользователя
            и контекста. Повтор не создаёт новый платный запуск и не разрешает переиспользовать
            финальный персональный ответ между пользователями.
        description: Обязательный ключ пользовательского действия. Повтор использует
          тот же ключ. Go сохраняет операцию и отпечаток параметров в PostgreSQL до
          ML; область ключа — пользователь и тип операции. Тот же ключ и параметры
          возвращают прежнее выполнение или результат, другие параметры дают 409.
          Доступ проверяется повторно.
      - "$ref": "#/components/parameters/CsrfToken"
