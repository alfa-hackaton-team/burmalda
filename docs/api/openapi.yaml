            проверяет, что запрос относится к актуальной версии; отсутствие заголовка
            даёт HTTP 428, устаревшая версия — HTTP 409.'
      - "$ref": "#/components/parameters/CsrfToken"
  "/v0.1/admin/sources/{source_id}/syncs":
    post:
      operationId: syncSourceNow
      tags:
      - AdminSources
      summary: Запустить ручную синхронизацию
      description: Синхронизация источника выполняется как фоновая операция и отслеживается
        отдельно от генерации разбора. Ошибки неподдерживаемого адаптера и конфигурации
        различимы. Ручной запуск проходит проверку прав и правил включения источника.
        Реестр и выполнение синхронизации принадлежат Go; операция не проксируется
        в ML как управление источником.
      responses:
        '202':
          description: Структурированный ответ
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/SyncOperation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
            504 — превышение времени ожидания. Ответ не раскрывает секреты, внутренние
            стеки и недоступные пользователю ресурсы.'
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '401':
          description: Нет действующей серверной сессии
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
        '403':
          description: Недостаточно прав на контекст, роль или операцию; для изменяющего
            запроса также ошибка CSRF/Origin
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Error"
      x-auth-policy: 'Go: cookie-сессия, права в БД, CSRF и Origin для изменения'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          description: Ключ связывает повтор с исходной операцией в пределах пользователя
            и контекста. Повтор не создаёт новый платный запуск и не разрешает переиспользовать
            финальный персональный ответ между пользователями.
      - "$ref": "#/components/parameters/CsrfToken"
  "/v0.1/admin/source-syncs/{sync_id}":
    get:
      operationId: getSourceSync
