      x-auth-policy: Доверенный пользователь и проверка доступа к ресурсу; анонимный
        доступ не разрешён
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Ограничение числа элементов страницы; применяется вместе с
            курсором для устойчивой постраничной выдачи.
    post:
      operationId: askFollowUp
      tags:
      - Conversation
      summary: Отправить связанный уточняющий вопрос
      description: Тело сообщения не меняет контекст, роль и исходный разбор. История
        упорядочена; параллельные вопросы и повторы сохраняют однозначную связь вопроса,
        выполнения и ответа.
      responses:
        '200':
          description: Готовый результат при синхронном выполнении
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/FollowUpResult"
        '202':
          description: Принятие в асинхронную обработку; ссылки на сообщения результата
            доступны после завершения
          content:
            application/json:
              schema:
                "$ref": "./schemas.yaml#/components/schemas/Generation"
        default:
          description: 'Единая ошибка: HTTP 400 — проверка входных данных; 403 — доступ
            запрещён; 404 — не найдено; 409 — конфликт или неготовый профиль; 422
            — недостаток доказательств или неподдерживаемая конфигурация; 429 — бюджет
            или частота; 502 — ошибка внешнего сервиса или источника; 503 — недоступность;
