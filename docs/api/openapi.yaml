  "/v0.1/admin/quality":
    get:
      operationId: getQuality
      tags:
      - AdminQuality
      summary: Отчёт о качестве, использовании и состоянии сервиса
      description: Отсутствие разметки или измерений отображается как NO_DATA, а не
        ноль. Отчёт доступен внутренним пользователям с соответствующими полномочиями;
        показатели сопровождаются периодом, выборкой и версиями.
      responses:
        '200':
          description: Структурированный ответ
