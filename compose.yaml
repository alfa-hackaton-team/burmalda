x-db-env: &db-env
  DATABASE_URL: postgres://burmalda:burmalda@db:5432/burmalda?sslmode=disable
  BACKEND_CONFIG_FILE: /app/config.yaml

x-s3-env: &s3-env
  RAW_STORAGE_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET:-raw-materials}
  S3_REGION: us-east-1
  S3_ENDPOINT: http://s3local:8333
  AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-localreview}
  AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-localreviewsecret}

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_DATA_MODE: ${FRONTEND_DATA_MODE:-demo}
        VITE_AUTH_START_URL: ${FRONTEND_AUTH_START_URL:-}
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-13001}:80"
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: burmalda
      POSTGRES_USER: burmalda
      POSTGRES_PASSWORD: burmalda
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burmalda -d burmalda"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  s3local:
    image: chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-localreview}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-localreviewsecret}
      S3_BUCKET: ${S3_BUCKET:-raw-materials}
    volumes:
      - s3local_data:/data
    ports:
      - "127.0.0.1:${LOCAL_S3_PORT:-8333}:8333"
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["/app/migrate"]
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  s3-init:
    build: ./backend
    command: ["/app/rawstorage", "init-bucket"]
    environment:
      <<: [*db-env, *s3-env]
    depends_on:
      s3local:
        condition: service_started
    restart: "no"

  data-import:
    build: ./backend
    command: ["/app/dataimport"]
    environment:
      <<: [*db-env, *s3-env]
      DATASET_DIR: /data/hackathon
      ML_PIPELINE_VERSION: ${ML_PIPELINE_VERSION:-}
      ML_MAX_TEXT_BYTES: ${ML_MAX_TEXT_BYTES:-131072}
    volumes:
      - ./data/hackathon:/data/hackathon:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: ./backend
    command: ["/app/api"]
    environment:
      <<: *db-env
      HTTP_ADDR: :8080
      AUTH_PASSWORD_LOGIN_ENABLED: ${AUTH_PASSWORD_LOGIN_ENABLED:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ML_PIPELINE_VERSION: ${ML_PIPELINE_VERSION:-}
      ML_BASE_URL: ${ML_BASE_URL:-}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      ML_ANALYSIS_CONFIG_VERSION: ${ML_ANALYSIS_CONFIG_VERSION:-}
      ML_READ_DATABASE_URL: ${ML_READ_DATABASE_URL:-}
      METRICS_ADDR: :19095
      DATASET_REQUIRED: "true"
      DATASET_API_TOKEN: ${DATASET_API_TOKEN:-}
      # Local-only default keeps the documented one-command startup working.
      # Deployments outside local Compose must override it with a random key.
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY:-YnVybWFsZGEtbG9jYWwtY3Vyc29yLWtleS0wMDAwMDE=}
      # Exact local frontend origins only; deployments must override this list.
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:13001,http://localhost:13001,http://localhost:18080,http://127.0.0.1:18080}
    depends_on:
      migrate:
        condition: service_completed_successfully
      data-import:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-18080}:8080"
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["/app/worker"]
    environment:
      <<: [*db-env, *s3-env]
      METRICS_ADDR: :19090
      DATASET_REQUIRED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      ML_PIPELINE_VERSION: ${ML_PIPELINE_VERSION:-}
      ML_MAX_TEXT_BYTES: ${ML_MAX_TEXT_BYTES:-131072}
      ML_BASE_URL: ${ML_BASE_URL:-}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      data-import:
        condition: service_completed_successfully
      alloy:
        condition: service_started
    restart: unless-stopped

  observer:
    build: ./backend
    command: ["/app/observer"]
    environment:
      <<: [*db-env, *s3-env]
      METRICS_ADDR: :19091
      POSTGRES_VOLUME_PATH: /storage-volumes/postgres
      S3_VOLUME_PATH: /storage-volumes/s3
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    volumes:
      - postgres_data:/storage-volumes/postgres:ro
      - s3local_data:/storage-volumes/s3:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

  retention:
    build: ./backend
    command: ["/app/retention"]
    environment:
      <<: *db-env
      METRICS_ADDR: :19093
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  rawstorage:
    build: ./backend
    command: ["/app/rawstorage", "reconcile", "--metrics-addr", ":19094"]
    environment:
      <<: [*db-env, *s3-env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./backend/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19092}:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./backend/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.0
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./backend/observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./backend/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      PG_HOST: db
      PG_USER: burmalda
      PG_PASSWORD: burmalda
      PG_DATABASE: burmalda
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  s3local_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
